samples: data/config_data.tsv
lr_seq_format: fastq # depending on the format of the long reads to use (can be 'fastq', 'fasta')

################################################################################
#                             Software deployment                              #
################################################################################

deployment:
  # Where Snakemake keeps the conda environments it builds for the pipeline.
  #
  # Leave it empty and Snakemake uses `.snakemake/conda` in the working
  # directory, rebuilding every environment for every project. Point it at a
  # shared directory instead and the environments can be built once, from a
  # machine that has internet access:
  #
  #   strainmake run --config config.yaml --create-envs-only
  #
  # and then reused.
  #
  # Use an absolute path. Snakemake includes the *resolved* path of this
  # directory in each environment's identity, so it has to resolve to the same
  # thing everywhere: check `realpath` agrees on a node and on a another
  # node, since automounted or symlinked paths sometimes differ.
  conda_prefix: ""
  # when true, rules that would download reference data abort immediately with
  # an actionable message instead of retrying against unreachable hosts.
  # `strainmake run --offline` sets this for you.
  offline: false

################################################################################
#                             Reference databases                              #
################################################################################

databases:
  # Each database is located on its own, because in practice they may not be kept
  # together. Give each one an absolute path to a copy that
  # already exists, or leave it empty to use the default shown in the
  # comment, which is also where `strainmake fetch-databases` will put it.
  #
  # Set an entry to `false` instead to declare that this run does not use that
  # database at all: `bowtie2_index: false` when starting from
  # already-preprocessed reads, for instance, since the host index is then never
  # read. A database marked `false` is neither downloaded by
  # `strainmake fetch-databases` nor checked before a run.
  bowtie2_index: ""  # default: data/databases/bowtie2
  checkm2: ""        # default: data/databases/checkm2
  bakta: ""          # default: data/databases/bakta
  metaphlan: ""      # default: data/databases/metaphlan
  gtdbtk: ""         # default: data/databases/gtdb_tk
  meteor: ""         # default: data/databases/meteor
  strainscan: ""     # default: data/databases/strainscan
  # GTDB release fetched by `strainmake fetch-databases` (~105 GiB for r220).
  # must match the release GTDB-Tk expects, see
  # https://ecogenomics.github.io/GTDBTk/installing/index.html#gtdb-tk-reference-data
  gtdbtk_release_url: "https://data.gtdb.ecogenomic.org/releases/release220/220.0/auxillary_files/gtdbtk_package/full_package/gtdbtk_r220_data.tar.gz"
  # gene catalogue downloaded by `meteor download` (see `meteor download --help` for the full list)
  meteor_catalogue: hs_10_4_gut
  # StrainScan has no unattended download: its prebuilt databases are published
  # as per-species Google Drive links. Download the one matching your species
  # from https://github.com/liaoherui/StrainScan#pre-built-databases-download, or build one,
  # and put it at the `strainscan` path above.

################################################################################
#                                Preprocessing                                 #        
################################################################################ 

fastp:
  compression: 2 # --compression command of fastp
  minimal_read_length: 50 # --length_required command of fastp
  qualified_quality_phred: 15 # quality value (phred) that a base is qualified
  other_params: "" # other parameters to pass to fastp (e.g. "--nsplit 100")

# the same, but for long reads
fastp_long_read:
  compression: 2 # --compression command of fastp
  minimal_read_length: 1000 # --length_required command of fastp
  qualified_quality_phred: 12 # quality value (phred) that a base is qualified
  other_params: "" # other parameters to pass to fastplong (e.g. "--n_base_limit 100")

bowtie2:
  index_name: chm13v2.0 # for human. See others at https://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
  threads: 4

# samples sequencing depth that will be used for hybrid assembly, binning, etc. (only)
# only fill it if you want to subsample those reads, if, for hybrid assembly, binning, you want to use the 
# same FASTA/FASTQ used for LR/SR assembly, let those values empty
downsizing_for_hybrid:
  sr: "5g"
  lr: "5g"

lr_technology: pacbio # can be 'pacbio', 'pacbio-hifi', 'nanopore'

################################################################################
#                                   Assembly                                   #        
################################################################################        

assembly:
  assembler: # to be implemented (megahit, metaspades, idbaud...)
    - megahit 
    - metaspades
  long_read_assembler:
    - metaflye
  hybrid_assembler: # ensure you have long reads data for it to work
    - hybridspades
  # MEGAHIT configuration
  megahit:
    threads: 4
    min_contig_len: 500 # minimal contig length to be kept in the produced assembly
    other_params: "" # other parameters to pass to megahit
  # SPAdes configuration
  metaspades:
    threads: 4
    memory_limit: 50 # in GB
    min_contig_len: 500 # minimal contig length to be kept in the produced assembly
    other_params: "" # other parameters to pass to metaspades
  metaflye:
    threads: 4
    method: nanopore # or "pacbio"
    min_contig_len: 500 # minimal contig length to be kept in the produced assembly
    other_params: "" # other parameters to pass to metaflye
  hybridspades:
    threads: 4
    memory_limit: 50 # in GB
    min_contig_len: 500 # minimal contig length to be kept in the produced assembly
    other_params: "" # other parameters to pass to hybridspades
  hylight:
    threads: 4
    min_contig_len: 500 # minimal contig length to be kept in the produced assembly
    other_params: "" # other parameters to pass to hylight (e.g. "--nsplit 100")

################################################################################
#                               Assembly quality                               #
################################################################################

quast:
  threads: 4

################################################################################
#                          Non redundant gene catalog                          #
################################################################################

mmseqs2:
  sequence_identity_threshold: 0.95 # --min-seq-id arg in mmseq
  alignment_coverage_shorter_sequence: 0.9 # -c arg in mmseq
  threads: 10
representative_genes:
  minimal_gene_length: 100 # minimal non redundant gene length to be kept in the produced catalog (use 0 to not filter)

################################################################################
#                                   Binning                                    #
################################################################################

binning:
  binner: # currently: metabat2, semibin2. Others to be implemented
    # - metabat2 
    - semibin2
    # - vamb
  long_read_binner:
    - semibin2
  # minimap2 configuration for reads mapping
  minimap2:
    threads: 4
  # MetaBAT 2 configuration
  metabat2:
    min_contig_size: 1500 # minimun size of 1500 bp per the MetaBAT 2 doc
    minimum_mean_coverage: 1 # minimum mean coverage of a contig in each library for binning
    min_bin_size: 200000 # minimum size of a bin as the output
    threads: 4 # put 0 for using all cores
  semibin2:
    environment: ocean # (human_gut, dog_cut, ocean...) see https://semibin.readthedocs.io/en/latest/usage/#easy-single-binning-mode
    threads: 4 # put 0 for using all cores
  vamb:
    minfasta: 200000 # minimum bin size to output as fasta
    gpu: "" # if you don't want to use GPU, just let a "", if you want put "--cuda"
    epochs: 50 # number of epochs for VAE training
    threads: 10
    batch_sizes: [5 10 30]
    start_batch_size: 10

################################################################################
#                                 Bins quality                                 #
################################################################################

checkm2:
  threads: 4

################################################################################
#                               Bins refinement                                #
################################################################################

bins_refinement:
  binette:
    threads: 4
    low_mem: "" # if you want to run DIAMOND in low memory mode replace "" by "--low_mem"

################################################################################
#                             Bins post-processing                             #
################################################################################

bins_postprocessing:
  gtdbtk:
    threads: 1
    other_args: "" # write there others params you'd want to use
  drep:
    ani:
      - 95 # species threshold
      - 97 # strain threshold
    comparison_algorithm: "ANImf" # comparison algorithm used by dRep (goANI, ANIn, gANI, ANImf, fastANI)
    other_args: "" # write there others params you'd want to use (for example "--SkipMash --completeness 90"...)
    threads: 4
  genomes_quality_filtration:
    checkm2:
      threads: 15
    filtration:
      min_completeness: 75
      max_contamination: 10
  genes_prediction:
    prodigal:
      threads: 5
      ani: 95 # which one of the "drep" -> "ani" dereplicated genomes to use
  profiling:
    checkm1:
      threads: 5
  carveme:
    threads: 5
    solver: gurobi # or scip. If using gurobi, ensure you have a valid license file at the path below
    # https://support.gurobi.com/hc/en-us/articles/360013417211-Where-do-I-place-the-Gurobi-license-file-gurobi-lic
    gurobi_license: config/gurobi.lic
  bakta:
    threads: 10
    parallel_jobs: 2 # number of Bakta processes to run in parallel

################################################################################
#                             Taxonomic profiling                              #
################################################################################

# a tool listed here has its reference database checked before a run starts, and
# fetched by `strainmake fetch-databases`. Delete a section to declare that you
# do not use that tool.
taxonomic_profiling:
  metaphlan:
    threads: 4
  meteor:
    threads: 10
    downsize:
      - 10000000 # number of reads to downsize to (in millions) (can pass more values)
  # StrainScan is species-specific and StrainMake cannot download its database
  # for you: pick the one matching your species from
  # https://github.com/liaoherui/StrainScan#pre-built-databases-download, or build one,
  # and put it at the `databases: strainscan:` path.
  strainscan:

################################################################################
#                              Strains profiling                               #
################################################################################

strains_profiling:
  minimap2:
    threads: 20
  freebayes:
    min_alternate_count: 1
    min_alternate_fraction: 0.01
  instrain:
    profile:
      threads: 20
    compare:
      threads: 20
  floria:
    threads: 20