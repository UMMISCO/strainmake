name: meteor
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12
  - bowtie2>=2.3.5
  - pip
  - pip:
    - meteor==2.0.21
variables:
  REFERENCE: data/meteor_db # should be the path to the catalogue reference to be used by Meteor
                            # https://github.com/metagenopolis/meteor?tab=readme-ov-file#1-download-or-build-a-custom-reference