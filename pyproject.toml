[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strainmake"
version = "0.2.0-pre1"
description = "StrainMake: reproducible hybrid metagenomics with MAG recovery and strain-level resolution "
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.12",
    "pyyaml>=6.0",
    "pandas>=1.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
strainmake = "strainmake.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["strainmake*"]

[tool.pytest.ini_options]
testpaths = ["strainmake/tests"]
# ensure the repo root is on sys.path so namespace-package imports
# like `from workflow.scripts.prepare import ...` work without installing them
pythonpath = ["."]

[tool.coverage.run]
source = ["strainmake"]
omit = ["strainmake/tests/*"]
